x-app: &app
  build: .
  environment:
    REDIS_URL: redis://redis:6379/0
    MYSQL_URL: mysql+pymysql://dtq:dtq@mysql:3306/dtq
    QUEUES: high,default,low
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dtq
      MYSQL_USER: dtq
      MYSQL_PASSWORD: dtq
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    command: ["uvicorn", "dtq.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "dtq.worker"]
    deploy:
      replicas: 3
    stop_grace_period: 30s

volumes:
  mysql-data:
  redis-data:
